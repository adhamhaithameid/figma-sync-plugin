<!DOCTYPE html>
<html>
<head><style>
  body { font: 13px/1.5 -apple-system, sans-serif; margin: 0; padding: 16px; color: #1a1a1a; }
  h3 { margin: 0 0 12px; font-size: 14px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; cursor: pointer; display: block; width: 100%; margin-bottom: 8px; text-align: left; }
  button.primary { background: #CD1722; color: #fff; border-color: #CD1722; }
  button:hover { border-color: #CD1722; }
  textarea { width: 100%; height: 110px; font: 10px/1.4 monospace; border: 1px solid #d4d4d8; border-radius: 6px; padding: 6px; box-sizing: border-box; }
  #report { max-height: 140px; overflow: auto; font: 10px/1.5 monospace; background: #f4f4f5; border-radius: 6px; padding: 8px; white-space: pre-wrap; display: none; }
  .status { color: #52525b; font-size: 12px; margin-top: 8px; min-height: 16px; }
  .err { color: #b91c1c; }
</style></head>
<body>
<h3>SIS Sync — design ↔ code</h3>
<button class="primary" id="buildall">Build the full design system</button>
<button id="buildf">Rebuild Foundations only</button>
<button id="buildc">Rebuild Core Components only</button>
<button id="baseline">Copy baseline JSON</button>
<button id="compare">Compare with pasted baseline</button>
<textarea id="baseline" placeholder="Paste the committed qa/figma-baseline.json here, then press Compare…"></textarea>
<div id="report"></div>
<div class="status" id="status">Ready.</div>
<script>
  const status = (t, isErr) => { const s = document.getElementById("status"); s.textContent = t; s.className = "status" + (isErr ? " err" : ""); };
  document.getElementById("buildall").onclick = () => { status("Building the full design system…"); parent.postMessage({ pluginMessage: { type: "build-all" } }, "*"); };
  document.getElementById("buildf").onclick = () => { status("Building Foundations…"); parent.postMessage({ pluginMessage: { type: "build-foundations" } }, "*"); };
  document.getElementById("buildc").onclick = () => { status("Building Core Components…"); parent.postMessage({ pluginMessage: { type: "build-components" } }, "*"); };
  document.getElementById("baseline").onclick = () => { status("Serializing baseline…"); parent.postMessage({ pluginMessage: { type: "baseline" } }, "*"); };
  document.getElementById("compare").onclick = () => {
    const v = document.getElementById("baseline").value.trim();
    if (!v) { status("Paste the committed baseline JSON first.", true); return; }
    status("Comparing…");
    parent.postMessage({ pluginMessage: { type: "compare", json: v } }, "*");
  };
  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "done") { status("Done: " + msg.text); }
    if (msg.type === "error") { status("ERROR: " + msg.text, true); }
    if (msg.type === "baseline") {
      const ta = document.getElementById("baseline");
      ta.value = msg.json;
      ta.select();
      document.execCommand("copy");
      status("Baseline copied (" + msg.json.length + " chars). Save as qa/figma-baseline.json and commit.");
      const rep = document.getElementById("report");
      rep.style.display = "block";
      rep.textContent = msg.json.slice(0, 400) + "…";
    }
    if (msg.type === "compareResult") {
      const r = msg.report;
      const rep = document.getElementById("report");
      rep.style.display = "block";
      rep.textContent =
        "ADDED (" + r.added.length + "):\n" + r.added.join("\n") +
        "\n\nREMOVED (" + r.removed.length + "):\n" + r.removed.join("\n") +
        "\n\nCHANGED (" + r.changed.length + "):\n" + r.changed.join("\n");
      status("Compare done. " + r.added.length + " added, " + r.removed.length + " removed, " + r.changed.length + " changed.");
    }
  };
</script>
</body>
</html>
